<ng-container [formGroup]="form">
  <ng-select
    #ngSelectComponent
    class="{{ uppercased ? 'uppercased' : '' }}"
    type="text"
    placeholder="{{ placeholder }}"
    [addTag]="addTag ? addTag : true"
    [bindLabel]="bindLabel"
    [bindValue]="bindValue"
    (keyup)="setTemporaryName($event)"
    (keydown.enter)="setByEnter()"
    [items]="items"
    (change)="change()"
    (reset)="reset()"
    dropdownPosition="{{ dropdownPosition || 'down' }}"
  >
    <ng-template ng-footer-tmp>
      @if (!checkNewElement()) {
      <div class="create-new"><i class="moon-Add"></i>&nbsp;Add new {{ whatToAddName }}</div>
      } @if (checkNewElement()) {
      <div class="create-new add" (click)="addNewElement()">
        <i class="moon-Add"></i>&nbsp;Add "<strong class="temp-name">{{ temporaryName }}</strong
        >"
      </div>
      }
    </ng-template>
  </ng-select>
</ng-container>
