<div class="holder {{ this.data.link ? 'add-error-link-cursor' : '' }}">
  <div class="icon float">
    @if (data.className === 'toast-success') {
    <i class="fas fa-check-circle"></i>
    } @if (data.className === 'toast-info') {
    <i class="fas fa-info-circle"></i>
    } @if (data.className === 'toast-warning') {
    <i class="fas fa-exclamation-triangle"></i>
    } @if (data.className === 'toast-error') {
    <i class="fas fa-exclamation-circle"></i>
    }
  </div>

  <div [innerHTML]="data.html" class="large float" (click)="processOptionalLink()"></div>

  @if (data.className === 'toast-error') {
  <a (click)="close($event)" class="small float"><i class="moon-Close"></i></a>
  }
  <div class="clear"></div>
</div>
