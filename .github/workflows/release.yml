name: Release desktop app

# Pushing a vX.Y.Z tag (see `npm run hopkey-release`) builds the desktop app for every platform and publishes it,
# with the latest*.yml files the in-app update check reads, to a GitHub release. Packages are code-signed when the
# signing secrets are configured, and built unsigned otherwise.
# A pre-release tag such as vX.Y.Z-rc.1 runs the same build as a dry run: the app gets the tag's version, and the
# release is published as a pre-release, which the in-app update check skips.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  HUSKY: "0"
  PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease="$PRERELEASE"
          --title "Hopkey ${GITHUB_REF_NAME#v}"
          --notes "See the [changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
          - os: windows-latest
            platform: --win --x64
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build core
        working-directory: packages/core
        run: npm ci && npm run build
      - run: npm ci
        working-directory: packages/desktop-app
      # electron-builder uploads to the release named after the package version
      - name: Match the version to the tag
        working-directory: packages/desktop-app
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$PRERELEASE" = true ]; then
            npm pkg set version="$version"
          elif [ "$(npm pkg get version | tr -d '"')" != "$version" ]; then
            echo "::error::packages/desktop-app/package.json has version $(npm pkg get version), but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npx gushio gushio/target-build.js "configuration production"
        working-directory: packages/desktop-app
      - name: Package and upload to the draft release
        working-directory: packages/desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          unsigned=()
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No signing certificate configured, building unsigned packages"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unsigned=(-c.mac.forceCodeSigning=false -c.mac.notarize=false)
          fi
          npx electron-builder build ${{ matrix.platform }} --publish always "${unsigned[@]}"

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
