name: Docs

# Publishes the documentation to the gh-pages branch (GitHub Pages) with mike, under the desktop app version and the
# "latest" alias that the links in the app point to.
on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - docs_extra/**
      - mkdocs.yml
      - packages/desktop-app/package.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the git-revision-date plugin reads the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          pip install "mkdocs<2" "mkdocs-material<10" mkdocs-video mkdocs-img2fig-plugin
          mkdocs-git-revision-date-plugin mkdocs-minify-plugin "mike<3"
      - name: Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          version=$(jq -r .version packages/desktop-app/package.json)
          mike deploy --push --update-aliases "$version" latest
          mike set-default --push latest
